# Local development dependencies only. The API and website run on your machine with `npm run dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:

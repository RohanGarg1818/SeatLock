# Render's free tier puts the API to sleep after ~15 minutes without traffic, and waking it takes 30-60 s,
# which made the first login after a quiet spell look broken. This pings /health every 10 minutes to keep it awake.
name: keep-awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 90 https://seatlock-wlrg.onrender.com/health
